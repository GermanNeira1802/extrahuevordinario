<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Imágenes IA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background-color: #1e293b;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .controls-section h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .controls-section p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    textarea, select {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, select:focus {
      border-color: #38bdf8;
    }

    textarea {
      resize: none;
      height: 100px;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .generate-btn:hover {
      opacity: 0.9;
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .generate-btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    /* Sección de previsualización */
    .preview-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      border-radius: 16px;
      border: 2px dashed #334155;
      position: relative;
      min-height: 320px;
      overflow: hidden;
    }

    .preview-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder-text {
      color: #64748b;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .download-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background-color: rgba(15, 23, 42, 0.8);
      color: #fff;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: none;
      backdrop-filter: blur(4px);
    }

    .download-btn:hover {
      background-color: #38bdf8;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Panel de Control -->
    <div class="controls-section">
      <h1>✨ Creador de Imágenes IA</h1>
      <p>Escribe tu idea en español o inglés y genera arte al instante.</p>

      <div class="input-group">
        <label for="promptInput">Descripción de la imagen (Prompt):</label>
        <textarea id="promptInput" placeholder="Ej: Un gato astronauta navegando por la galaxia, estilo arte digital, luces de neón..."></textarea>
      </div>

      <div class="input-group">
        <label for="styleSelect">Estilo visual:</label>
        <select id="styleSelect">
          <option value="">Sin estilo específico</option>
          <option value=", photorealistic, 8k resolution, highly detailed">📸 Fotorrealista</option>
          <option value=", digital art, concept art, vibrant colors">🎨 Arte Digital</option>
          <option value=", anime style, studio ghibli aesthetic">⛩️ Anime / Manga</option>
          <option value=", cyberpunk, neon lighting, futuristic city">🌆 Cyberpunk</option>
          <option value=", oil painting style, masterpiece, classic">🖼️ Pintura al Óleo</option>
        </select>
      </div>

      <button class="generate-btn" id="generateBtn" onclick="generateImage()">
        <span>🎨 Generar Imagen</span>
      </button>
    </div>

    <!-- Panel de Previsualización -->
    <div class="preview-section" id="previewContainer">
      <div class="placeholder-text" id="placeholderText">
        🖼️<br>Tu imagen generada aparecerá aquí
      </div>
      <div class="spinner" id="spinner"></div>
      <img id="resultImage" alt="Imagen generada por IA">
      <button class="download-btn" id="downloadBtn" onclick="downloadImage()">💾 Descargar</button>
    </div>
  </div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('promptInput').value.trim();
      const style = document.getElementById('styleSelect').value;
      const generateBtn = document.getElementById('generateBtn');
      const placeholderText = document.getElementById('placeholderText');
      const spinner = document.getElementById('spinner');
      const resultImage = document.getElementById('resultImage');
      const downloadBtn = document.getElementById('downloadBtn');

      if (!prompt) {
        alert('Por favor, escribe una descripción para la imagen.');
        return;
      }

      // Preparar la interfaz en estado de carga
      generateBtn.disabled = true;
      generateBtn.innerText = 'Cargando imagen...';
      placeholderText.style.display = 'none';
      resultImage.style.display = 'none';
      downloadBtn.style.display = 'none';
      spinner.style.display = 'block';

      // Combinar texto de búsqueda con estilo seleccionado
      const fullPrompt = prompt + style;
      const encodedPrompt = encodeURIComponent(fullPrompt);
      
      // Semilla aleatoria para variar las imágenes en cada clic
      const seed = Math.floor(Math.random() * 1000000);
      const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=800&height=800&seed=${seed}&nologo=true`;

      // Cargar imagen de la API
      const img = new Image();
      img.src = imageUrl;

      img.onload = () => {
        spinner.style.display = 'none';
        resultImage.src = imageUrl;
        resultImage.style.display = 'block';
        downloadBtn.style.display = 'block';
        
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>🎨 Generar Imagen</span>';
      };

      img.onerror = () => {
        spinner.style.display = 'none';
        placeholderText.style.display = 'block';
        placeholderText.innerHTML = '❌ Ocurrió un error al generar la imagen.<br>Inténtalo de nuevo.';
        
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>🎨 Generar Imagen</span>';
      };
    }

    // Función para descargar la imagen directamente
    async function downloadImage() {
      const imgUrl = document.getElementById('resultImage').src;
      try {
        const response = await fetch(imgUrl);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `imagen-ia-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        window.open(imgUrl, '_blank');
      }
    }
  </script>
</body>
</html>
