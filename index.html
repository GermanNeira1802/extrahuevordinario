<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App de Música</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #1f1f1f;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
      color: #ff0000;
    }

    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-form input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #333;
      border-radius: 20px;
      background-color: #121212;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-form button {
      background-color: #ff0000;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      margin-bottom: 16px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .quick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .quick-btn {
      background: #2a2a2a;
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .quick-btn:hover {
      background: #3a3a3a;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🔴 StreamMusic YT</h1>

    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Escribe canción o artista..." required>
      <button type="submit">Buscar</button>
    </form>

    <div class="video-container">
      <iframe 
        id="ytPlayer" 
        src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="quick-list" id="quickList">
      <button class="quick-btn" onclick="playVideo('jfKfPfyJRdk')">🎵 Lofi Hip Hop Beats</button>
      <button class="quick-btn" onclick="playVideo('fJ9rUzIMcZQ')">🎵 Queen - Bohemian Rhapsody</button>
      <button class="quick-btn" onclick="playVideo('09R8_2nJtjg')">🎵 Maroon 5 - Sugar</button>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const ytPlayer = document.getElementById('ytPlayer');

    // Cambia el video del reproductor directamente sin pasar por peticiones bloqueadas
    function playVideo(id) {
      ytPlayer.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
    }

    searchForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      // Redirige la búsqueda limpia a través del sistema embed de YouTube
      ytPlayer.src = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(query)}`;
    });
  </script>

</body>
</html>
