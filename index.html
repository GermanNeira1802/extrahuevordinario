<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App de Música</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: #1db954; /* Color estilo Spotify */
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 20px;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input::placeholder {
      color: #aaa;
    }

    .song-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .song-item:hover {
      background-color: #2a2a2a;
    }

    .song-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .song-info p {
      font-size: 0.8rem;
      color: #aaa;
    }

    .player {
      background-color: #282828;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .now-playing {
      margin-bottom: 12px;
    }

    .now-playing h4 {
      font-size: 1rem;
      color: #fff;
    }

    .now-playing p {
      font-size: 0.85rem;
      color: #1db954;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🎵 StreamMusic</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por título o artista..." onkeyup="filterSongs()">
    </div>

    <ul class="song-list" id="songList">
      <!-- Las canciones se cargan dinámicamente -->
    </ul>

    <div class="player">
      <div class="now-playing">
        <h4 id="currentTitle">Selecciona una canción</h4>
        <p id="currentArtist">--</p>
      </div>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    // Base de datos de ejemplo con canciones de prueba funcionales (audio real)
    const playlist = [
      {
        title: "Acoustic Breeze",
        artist: "Bensound",
        url: "https://www.bensound.com/bensound-music/bensound-acousticbreeze.mp3"
      },
      {
        title: "Creative Minds",
        artist: "Bensound",
        url: "https://www.bensound.com/bensound-music/bensound-creativeminds.mp3"
      },
      {
        title: "Ukulele",
        artist: "Bensound",
        url: "https://www.bensound.com/bensound-music/bensound-ukulele.mp3"
      },
      {
        title: "Sunny",
        artist: "Bensound",
        url: "https://www.bensound.com/bensound-music/bensound-sunny.mp3"
      }
    ];

    const songListEl = document.getElementById('songList');
    const audioPlayer = document.getElementById('audioPlayer');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');

    // Renderizar la lista de canciones
    function renderSongs(songs) {
      songListEl.innerHTML = '';
      if (songs.length === 0) {
        songListEl.innerHTML = '<li style="color: #aaa; text-align: center; padding: 10px;">No se encontraron canciones</li>';
        return;
      }

      songs.forEach(song => {
        const li = document.createElement('li');
        li.className = 'song-item';
        li.innerHTML = `
          <div class="song-info">
            <h3>${song.title}</h3>
            <p>${song.artist}</p>
          </div>
          <span>▶️</span>
        `;
        li.onclick = () => playSong(song);
        songListEl.appendChild(li);
      });
    }

    // Reproducir canción seleccionada
    function playSong(song) {
      currentTitle.textContent = song.title;
      currentArtist.textContent = song.artist;
      audioPlayer.src = song.url;
      audioPlayer.play();
    }

    // Filtrar canciones en tiempo real con la barra de búsqueda
    function filterSongs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = playlist.filter(song => 
        song.title.toLowerCase().includes(query) || 
        song.artist.toLowerCase().includes(query)
      );
      renderSongs(filtered);
    }

    // Cargar la lista inicial
    renderSongs(playlist);
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music App - YouTube Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #1f1f1f;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
      color: #ff0000; /* Color distintivo de YouTube */
    }

    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-form input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #333;
      border-radius: 20px;
      background-color: #121212;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-form button {
      background-color: #ff0000;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .search-form button:hover {
      background-color: #cc0000;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      margin-bottom: 16px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .now-playing {
      text-align: center;
      background-color: #121212;
      padding: 12px;
      border-radius: 8px;
    }

    .now-playing h4 {
      font-size: 0.95rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🔴 StreamMusic YT</h1>

    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Escribe canción o artista..." required>
      <button type="submit">Buscar</button>
    </form>

    <!-- Reproductor de YouTube -->
    <div class="video-container">
      <iframe 
        id="ytPlayer" 
        src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="now-playing">
      <h4 id="currentTitle">Lofi Hip Hop - Beats to Relax/Study to</h4>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const ytPlayer = document.getElementById('ytPlayer');
    const currentTitle = document.getElementById('currentTitle');

    searchForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const query = searchInput.value.trim();
      
      if (query) {
        // Formateamos la búsqueda para cargar el primer resultado directo de YouTube
        const searchUrl = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`;
        
        // Actualizamos el reproductor
        ytPlayer.src = searchUrl;
        currentTitle.textContent = `Reproduciendo: "${query}"`;
      }
    });
  </script>

</body>
</html>
