<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App de Música</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: #1db954; /* Color estilo Spotify */
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 20px;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input::placeholder {
      color: #aaa;
    }

    .song-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .song-item:hover {
      background-color: #2a2a2a;
    }

    .song-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .song-info p {
      font-size: 0.8rem;
      color: #aaa;
    }

    .player {
      background-color: #282828;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .now-playing {
      margin-bottom: 12px;
    }

    .now-playing h4 {
      font-size: 1rem;
      color: #fff;
    }

    .now-playing p {
      font-size: 0.85rem;
      color: #1db954;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🎵 StreamMusic</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por título o artista..." onkeyup="filterSongs()">
    </div>

    <ul class="song-list" id="songList">
      <!-- Las canciones se cargan dinámicamente -->
    </ul>

    <div class="player">
      <div class="now-playing">
        <h4 id="currentTitle">Selecciona una canción</h4>
        <p id="currentArtist">--</p>
      </div>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    // Base de datos de ejemplo con canciones de prueba funcionales (audio real)
    const playlist = [
      {
        title: "Acoustic Breeze",
        artist: "Bensound",
        url: "https://www.bensound.com/bensound-music/bensound-acousticbreeze.mp3"
      },
      {
        title: "Creative Minds",
        artist: "Bensound",
        url: "https://www.bensound.com/bensound-music/bensound-creativeminds.mp3"
      },
      {
        title: "Ukulele",
        artist: "Bensound",
        url: "https://www.bensound.com/bensound-music/bensound-ukulele.mp3"
      },
      {
        title: "Sunny",
        artist: "Bensound",
        url: "https://www.bensound.com/bensound-music/bensound-sunny.mp3"
      }
    ];

    const songListEl = document.getElementById('songList');
    const audioPlayer = document.getElementById('audioPlayer');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');

    // Renderizar la lista de canciones
    function renderSongs(songs) {
      songListEl.innerHTML = '';
      if (songs.length === 0) {
        songListEl.innerHTML = '<li style="color: #aaa; text-align: center; padding: 10px;">No se encontraron canciones</li>';
        return;
      }

      songs.forEach(song => {
        const li = document.createElement('li');
        li.className = 'song-item';
        li.innerHTML = `
          <div class="song-info">
            <h3>${song.title}</h3>
            <p>${song.artist}</p>
          </div>
          <span>▶️</span>
        `;
        li.onclick = () => playSong(song);
        songListEl.appendChild(li);
      });
    }

    // Reproducir canción seleccionada
    function playSong(song) {
      currentTitle.textContent = song.title;
      currentArtist.textContent = song.artist;
      audioPlayer.src = song.url;
      audioPlayer.play();
    }

    // Filtrar canciones en tiempo real con la barra de búsqueda
    function filterSongs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = playlist.filter(song => 
        song.title.toLowerCase().includes(query) || 
        song.artist.toLowerCase().includes(query)
      );
      renderSongs(filtered);
    }

    // Cargar la lista inicial
    renderSongs(playlist);
  </script>
</body>
</html>
