<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music App - YouTube Search</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #1f1f1f;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
      color: #ff0000;
    }

    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-form input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #333;
      border-radius: 20px;
      background-color: #121212;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-form button {
      background-color: #ff0000;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      margin-bottom: 16px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .results-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .result-item:hover {
      background-color: #2a2a2a;
    }

    .result-item img {
      width: 50px;
      height: 38px;
      border-radius: 4px;
      object-fit: cover;
    }

    .result-info h4 {
      font-size: 0.85rem;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🔴 StreamMusic YT</h1>

    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Escribe canción o artista..." required>
      <button type="submit">Buscar</button>
    </form>

    <div class="video-container">
      <iframe 
        id="ytPlayer" 
        src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <ul class="results-list" id="resultsList"></ul>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const ytPlayer = document.getElementById('ytPlayer');
    const resultsList = document.getElementById('resultsList');

    searchForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const query = searchInput.value.trim();
      
      if (!query) return;

      resultsList.innerHTML = '<li style="text-align:center; padding:10px; color:#aaa;">Buscando...</li>';

      try {
        // Usamos una API pública de consulta a YouTube que no requiere clave registrada
        const response = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=music`);
        const data = await response.json();

        resultsList.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          resultsList.innerHTML = '<li style="text-align:center; padding:10px; color:#aaa;">No se encontraron resultados</li>';
          return;
        }

        // Filtramos solo videos
        const videos = data.items.filter(item => item.type === 'stream').slice(0, 5);

        videos.forEach((video, index) => {
          // Extraemos el ID del video
          const videoId = video.url.split('v=')[1];
          
          // Reproducimos el primer resultado de inmediato
          if (index === 0) {
            ytPlayer.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
          }

          // Creamos la lista de alternativas
          const li = document.createElement('li');
          li.className = 'result-item';
          li.innerHTML = `
            <img src="${video.thumbnail}" alt="thumb">
            <div class="result-info">
              <h4>${video.title}</h4>
            </div>
          `;

          li.onclick = () => {
            ytPlayer.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
          };

          resultsList.appendChild(li);
        });

      } catch (error) {
        // Enlace alternativo directo si falla la red pública
        const encoded = encodeURIComponent(query);
        ytPlayer.src = `https://www.youtube-nocookie.com/embed?listType=search&list=${encoded}`;
        resultsList.innerHTML = '<li style="text-align:center; padding:10px; color:#aaa;">Reproduciendo búsqueda directa. Si no carga, presiona sobre el reproductor.</li>';
      }
    });
  </script>

</body>
</html>
