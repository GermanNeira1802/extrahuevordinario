<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número Secreto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #0984e3;
            margin-bottom: 10px;
        }
        input {
            padding: 10px;
            font-size: 18px;
            width: 60%;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            margin-right: 10px;
            outline: none;
        }
        input:focus {
            border-color: #0984e3;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #74b9ff;
        }
        #mensaje {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Adivina el Número</h1>
        <p>He pensado en un número del <strong>1 al 50</strong>. ¿Puedes adivinar cuál es?</p>
        
        <input type="number" id="intento" min="1" max="50" placeholder="Tu número">
        <button onclick="verificarAdivinanza()">Probar</button>
        
        <p id="mensaje"></p>
        <button id="reiniciar" onclick="reiniciarJuego()" style="display: none; margin-top: 15px; background-color: #00b894;">Jugar de nuevo</button>
    </div>

    <script>
        // Generar número aleatorio del 1 al 50
        let numeroSecreto = Math.floor(Math.random() * 50) + 1;
        let intentos = 0;

        function verificarAdivinanza() {
            const inputUsuario = document.getElementById('intento');
            const mensaje = document.getElementById('mensaje');
            const botonReiniciar = document.getElementById('reiniciar');
            const valor = parseInt(inputUsuario.value);

            // Validar que sea un número correcto
            if (isNaN(valor) || valor < 1 || valor > 50) {
                mensaje.style.color = '#d63031';
                mensaje.textContent = 'Por favor, ingresa un número válido entre 1 y 50.';
                return;
            }

            intentos++;

            if (valor === numeroSecreto) {
                mensaje.style.color = '#00b894';
                mensaje.textContent = `🎉 ¡Felicidades! Adivinaste el número en ${intentos} intentos.`;
                inputUsuario.disabled = true;
                botonReiniciar.style.display = 'inline-block';
            } else if (valor < numeroSecreto) {
                mensaje.style.color = '#e17055';
                mensaje.textContent = '📈 El número secreto es **MAYOR**.';
            } else {
                mensaje.style.color = '#6c5ce7';
                mensaje.textContent = '📉 El número secreto es **MENOR**.';
            }

            inputUsuario.value = '';
            inputUsuario.focus();
        }

        function reiniciarJuego() {
            numeroSecreto = Math.floor(Math.random() * 50) + 1;
            intentos = 0;
            
            const mensaje = document.getElementById('mensaje');
            const inputUsuario = document.getElementById('intento');
            const botonReiniciar = document.getElementById('reiniciar');

            mensaje.textContent = '';
            inputUsuario.disabled = false;
            inputUsuario.value = '';
            botonReiniciar.style.display = 'none';
            inputUsuario.focus();
        }
    </script>

</body>
</html>
