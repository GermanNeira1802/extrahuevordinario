<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Creator Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f111a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background-color: #1a1d2d;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid #2a2e45;
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
      color: #a855f7; /* Tono creativo/video */
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .stats-card {
      display: flex;
      justify-content: space-around;
      background-color: #11131d;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid #2a2e45;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item span {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .stat-item label {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .scene-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
      background-color: #11131d;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #2a2e45;
    }

    .scene-form input, .scene-form textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #2a2e45;
      border-radius: 8px;
      background-color: #1a1d2d;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .scene-form input:focus, .scene-form textarea:focus {
      border-color: #a855f7;
    }

    .scene-form textarea {
      resize: vertical;
      height: 70px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .scene-form button {
      background-color: #a855f7;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .scene-form button:hover {
      background-color: #9333ea;
    }

    .scenes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 350px;
      overflow-y: auto;
    }

    .scene-card {
      background-color: #11131d;
      border-radius: 10px;
      padding: 14px;
      border: 1px solid #2a2e45;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .scene-info h3 {
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .scene-info p {
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: pre-line;
    }

    .scene-meta {
      display: inline-block;
      font-size: 0.75rem;
      background-color: #2a2e45;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 6px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🎬 Video Creator Studio</h1>
    <p class="subtitle">Planificador de guiones y storyboard para tus videos</p>

    <div class="stats-card">
      <div class="stat-item">
        <span id="totalScenes">0</span>
        <label>Escenas</label>
      </div>
      <div class="stat-item">
        <span id="totalDuration">0s</span>
        <label>Duración Est.</label>
      </div>
    </div>

    <form class="scene-form" id="sceneForm">
      <input type="text" id="sceneTitle" placeholder="Título de la escena (ej. Introducción)" required>
      <textarea id="sceneScript" placeholder="¿Qué se va a decir o mostrar en esta escena?" required></textarea>
      <div class="row">
        <input type="number" id="sceneTime" placeholder="Duración (segundos)" min="1" value="10" required>
        <button type="submit">➕ Añadir Escena</button>
      </div>
    </form>

    <div class="scenes-list" id="scenesList">
      <!-- Las escenas se cargan aquí -->
    </div>
  </div>

  <script>
    let scenes = [];

    const sceneForm = document.getElementById('sceneForm');
    const sceneTitle = document.getElementById('sceneTitle');
    const sceneScript = document.getElementById('sceneScript');
    const sceneTime = document.getElementById('sceneTime');
    const scenesList = document.getElementById('scenesList');
    const totalScenesEl = document.getElementById('totalScenes');
    const totalDurationEl = document.getElementById('totalDuration');

    sceneForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const newScene = {
        id: Date.now(),
        title: sceneTitle.value.trim(),
        script: sceneScript.value.trim(),
        duration: parseInt(sceneTime.value) || 5
      };

      scenes.push(newScene);
      renderScenes();
      sceneForm.reset();
      sceneTime.value = "10";
    });

    function deleteScene(id) {
      scenes = scenes.filter(scene => scene.id !== id);
      renderScenes();
    }

    function renderScenes() {
      scenesList.innerHTML = '';
      
      if (scenes.length === 0) {
        scenesList.innerHTML = '<div class="empty-state">No hay escenas creadas. ¡Empieza añadiendo la primera!</div>';
        totalScenesEl.textContent = '0';
        totalDurationEl.textContent = '0s';
        return;
      }

      let totalSeconds = 0;

      scenes.forEach((scene, index) => {
        totalSeconds += scene.duration;

        const card = document.createElement('div');
        card.className = 'scene-card';
        card.innerHTML = `
          <div class="scene-info">
            <h3>#${index + 1} - ${scene.title}</h3>
            <p>${scene.script}</p>
            <span class="scene-meta">⏱️ ${scene.duration} segundos</span>
          </div>
          <button class="delete-btn" onclick="deleteScene(${scene.id})" title="Eliminar escena">🗑️</button>
        `;
        scenesList.appendChild(card);
      });

      totalScenesEl.textContent = scenes.length;
      
      // Formatear duración en minutos si pasa de 60s
      if (totalSeconds >= 60) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        totalDurationEl.textContent = `${mins}m ${secs}s`;
      } else {
        totalDurationEl.textContent = `${totalSeconds}s`;
      }
    }

    // Inicializar estado vacío
    renderScenes();
  </script>

</body>
</html>
