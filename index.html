<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Music App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0d12;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #161a23;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid #2a3142;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
      color: #e5a00d; /* Dorado cine */
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #2a3142;
      border-radius: 20px;
      background-color: #0b0d12;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: #e5a00d;
    }

    .song-list {
      list-style: none;
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: #0b0d12;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .song-item:hover {
      background-color: #1f2533;
      border-color: #e5a00d;
    }

    .song-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }

    .song-info p {
      font-size: 0.8rem;
      color: #8a94a6;
    }

    .player {
      background-color: #0b0d12;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid #2a3142;
    }

    .now-playing {
      margin-bottom: 12px;
    }

    .now-playing h4 {
      font-size: 1rem;
      color: #fff;
    }

    .now-playing p {
      font-size: 0.85rem;
      color: #e5a00d;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🎬 Cinema Soundtracks</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar película o tema..." onkeyup="filterSongs()">
    </div>

    <ul class="song-list" id="songList">
      <!-- Las canciones de películas se cargan dinámicamente -->
    </ul>

    <div class="player">
      <div class="now-playing">
        <h4 id="currentTitle">Selecciona una banda sonora</h4>
        <p id="currentArtist">--</p>
      </div>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    // Lista de música temática de películas con audio mp3 real directo
    const playlist = [
      {
        title: "Star Wars Main Theme",
        movie: "Star Wars",
        url: "https://ia800703.us.archive.org/33/items/StarWarsMainTheme/Star%20Wars%20Main%20Theme.mp3"
      },
      {
        title: "He's a Pirate",
        movie: "Piratas del Caribe",
        url: "https://ia800903.us.archive.org/27/items/HesAPirate/HesAPirate.mp3"
      },
      {
        title: "The Imperial March",
        movie: "Star Wars",
        url: "https://ia800703.us.archive.org/33/items/StarWarsMainTheme/The%20Imperial%20March.mp3"
      },
      {
        title: "Hedwig's Theme",
        movie: "Harry Potter",
        url: "https://ia800301.us.archive.org/26/items/HarryPotterThemeSong/Harry%20Potter%20Theme%20Song.mp3"
      },
      {
        title: "Time",
        movie: "Inception (El Origen)",
        url: "https://ia800201.us.archive.org/12/items/InceptionTime/Hans%20Zimmer%20-%20Time.mp3"
      }
    ];

    const songListEl = document.getElementById('songList');
    const audioPlayer = document.getElementById('audioPlayer');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');

    function renderSongs(songs) {
      songListEl.innerHTML = '';
      if (songs.length === 0) {
        songListEl.innerHTML = '<li style="color: #8a94a6; text-align: center; padding: 10px;">No se encontraron bandas sonoras</li>';
        return;
      }

      songs.forEach(song => {
        const li = document.createElement('li');
        li.className = 'song-item';
        li.innerHTML = `
          <div class="song-info">
            <h3>${song.title}</h3>
            <p>🎬 ${song.movie}</p>
          </div>
          <span>▶️</span>
        `;
        li.onclick = () => playSong(song);
        songListEl.appendChild(li);
      });
    }

    function playSong(song) {
      currentTitle.textContent = song.title;
      currentArtist.textContent = song.movie;
      audioPlayer.src = song.url;
      audioPlayer.play();
    }

    function filterSongs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = playlist.filter(song => 
        song.title.toLowerCase().includes(query) || 
        song.movie.toLowerCase().includes(query)
      );
      renderSongs(filtered);
    }

    // Cargar la lista inicial
    renderSongs(playlist);
  </script>
</body>
</html>
